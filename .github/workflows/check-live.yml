name: Published app availability

on:
  push:
    branches: [main]
    paths:
      - "scripts/check-live.mjs"
      - "docs/deployment.json"
      - ".github/workflows/check-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public HTTPS files without authentication
        run: node scripts/check-live.mjs
